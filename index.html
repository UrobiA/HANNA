<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hanna</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:#f5f5f5;
    font-family:Arial, Helvetica, sans-serif;
}

.wrapper{
    width:min(700px,95vw);
    margin:0 auto;
}

.card{
    width:100%;
    display:block;
    border-radius:15px;
    box-shadow:0 4px 20px rgba(0,0,0,.15);
    margin-bottom:20px;
}

.button{
    display:block;
    width:100%;
    padding:22px;
    margin-bottom:15px;
    background:#111;
    color:#fff;
    text-decoration:none;
    text-align:center;
    font-size:28px;
    font-weight:bold;
    border-radius:12px;
    transition:background .2s ease;
}

.button:hover{
    background:#333;
}

.button:last-child{
    margin-bottom:0;
}
</style>

</head>
<body>

<div class="wrapper">

    <img src="hanna-card.jpg" alt="Hanna" class="card">

    <a href="tel:+40741106587" class="button">
        📞 Call Dad
    </a>

    <a href="tel:+40740095234" class="button">
        📞 Call Mom
    </a>

</div>

</body>
</html>
